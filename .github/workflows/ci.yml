name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  cpp:
    name: C++ core tests and ESP32-S3 firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install ESP-IDF 5.5.5
        uses: espressif/install-esp-idf-action@v1
        with:
          version: v5.5.5
      - name: Core tests
        run: bash firmware/test/run.sh
      - name: USB log exporter host tests
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/checks/test-export-logs.py
      - name: Build firmware
        run: ./scripts/build/build-cpp.sh
      - name: Check retained boot ledger
        run: ./scripts/checks/check-boot-ledger.sh
      - name: Check firmware revision
        run: ./scripts/checks/check-git-rev.sh
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: inkwash-cpp-esp32s3
          if-no-files-found: error
          path: |
            firmware/build/inkwash.bin
            firmware/build/inkwash.elf
            firmware/build/inkwash.map
            firmware/build/flash_args
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
