name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  logic:
    name: inkwash-logic (host tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: logic
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy

      - name: Test
        run: cargo test --locked

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  firmware-format:
    name: inkwash-note4 (format)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-firmware
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt

      # rust-toolchain.toml pins espup's `esp` toolchain, which CI does not
      # install; +1.94.1 overrides it for rustfmt only, and needs no ESP-IDF.
      - name: Format check
        run: cargo +1.94.1 fmt --check

  firmware-build:
    name: inkwash-note4 (ESP32-S3 release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Xtensa Rust toolchain
        uses: esp-rs/xtensa-toolchain@v1.7
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: true

      - name: Install ESP-IDF 5.5.5
        uses: espressif/install-esp-idf-action@v1
        with:
          version: v5.5.5

      - name: Build release firmware
        env:
          SOURCE_DATE_EPOCH: "1700000000"
        run: ./scripts/build-rust.sh --release --locked

      - name: Clippy (firmware, target-side)
        env:
          SOURCE_DATE_EPOCH: "1700000000"
          INKWASH_CARGO_SUBCOMMAND: clippy
        run: ./scripts/build-rust.sh --release --locked -- -D warnings

      - name: Verify the boot ledger stays outside every loadable segment
        run: ./scripts/check-boot-ledger.sh

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: inkwash-note4-esp32s3
          if-no-files-found: error
          path: |
            rust-firmware/target/xtensa-esp32s3-espidf/release/inkwash-note4
            rust-firmware/target/xtensa-esp32s3-espidf/release/bootloader.bin
            rust-firmware/target/xtensa-esp32s3-espidf/release/partition-table.bin
            rust-firmware/target/xtensa-esp32s3-espidf/release/build/esp-idf-sys-*/out/build/libespidf.map
            rust-firmware/target/xtensa-esp32s3-espidf/release/build/esp-idf-sys-*/out/sdkconfig

  firmware-diagnostic-build:
    name: inkwash-note4 (ESP32-S3 diagnostic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Xtensa Rust toolchain
        uses: esp-rs/xtensa-toolchain@v1.7
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: true

      - name: Install ESP-IDF 5.5.5
        uses: espressif/install-esp-idf-action@v1
        with:
          version: v5.5.5

      - name: Build diagnostic firmware
        env:
          SOURCE_DATE_EPOCH: "1700000000"
        run: ./scripts/build-rust.sh --diagnostic --release --locked

      - name: Verify the boot ledger stays outside every loadable segment
        run: ./scripts/check-boot-ledger.sh rust-firmware/target-diagnostic/xtensa-esp32s3-espidf/release/inkwash-note4

  firmware-secure-build:
    name: inkwash-note4 (secure production config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Xtensa Rust toolchain
        uses: esp-rs/xtensa-toolchain@v1.7
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: true

      - name: Install ESP-IDF 5.5.5
        uses: espressif/install-esp-idf-action@v1
        with:
          version: v5.5.5

      - name: Generate ephemeral CI signing key
        run: espsecure.py generate_signing_key --version 2 "$RUNNER_TEMP/secure-boot-ci.pem"

      - name: Build secure configuration
        env:
          INKWASH_SECURE_BOOT_SIGNING_KEY: ${{ runner.temp }}/secure-boot-ci.pem
          SOURCE_DATE_EPOCH: "1700000000"
        run: ./scripts/build-secure.sh

      - name: Verify the boot ledger stays outside every loadable segment
        run: ./scripts/check-boot-ledger.sh rust-firmware/target-secure/xtensa-esp32s3-espidf/release/inkwash-note4
