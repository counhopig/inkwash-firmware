[package]
name = "inkwash-note4"
version = "0.5.0"
edition = "2021"
resolver = "2"
rust-version = "1.82"

[[bin]]
name = "inkwash-note4"
harness = false

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[patch.crates-io]
esp-idf-hal = { path = "../vendor/esp-idf-hal" }

[dependencies]
anyhow = "1"
inkwash-logic = { path = "../logic" }
embedded-svc = "0.29"
esp-idf-svc = { version = "0.52.1", features = ["critical-section"] }
esp32-nimble = "0.12"
heapless = "0.9"
log = "0.4"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
embuild = "0.33"

[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["components/zectrix_epd"]
bindings_header = "components/zectrix_epd/include/zectrix_epd.h"
bindings_module = "zectrix_epd"
