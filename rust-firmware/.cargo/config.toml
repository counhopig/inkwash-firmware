[build]
target = "xtensa-esp32s3-espidf"

[target.'cfg(target_os = "espidf")']
linker = "ldproxy"
# Never flash by port name alone: the wrapper refuses any board that is not
# the authorized Note 4 (ESP32-S3, 16 MB, INKWASH_NOTE4_MAC). Set
# INKWASH_NOTE4_PORT to the board's serial port.
runner = ["../scripts/flash-note4.sh", "--monitor"]
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32s3"
ESP_IDF_VERSION = "v5.5.5"
ESP_IDF_TOOLS_INSTALL_DIR = "fromenv"
CARGO_WORKSPACE_DIR = { value = "", relative = true }
# LIBCLANG_PATH and IDF_PATH are machine-specific (espup installs esp-clang
# under the per-user rustup toolchain dir; ESP-IDF's location varies per
# install) and are resolved dynamically by scripts/build-rust.sh /
# build-rust.ps1 instead of being hardcoded here.
